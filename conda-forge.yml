bot:
  abi_migration_branches:
  - 21.x
  - 20.x
  - 19.x
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  osx_arm64: default
remote_ci_setup:
  - conda-forge-ci-setup=4
  # https://github.com/conda/conda-build/issues/6076
  - conda-build <26.7
test: native_and_emulated
